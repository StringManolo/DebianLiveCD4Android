plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'io.github.stringmanolo.DebianLiveCD4Android'
  compileSdk 34

  defaultConfig {
    applicationId "io.github.stringmanolo.DebianLiveCD4Android"
    minSdk 24
    // MUST stay <= 28: Android 10+ blocks exec() of files in the app data dir for targetSdk >= 29 (W^X),
    // and the Debian rootfs binaries live there.
    targetSdk 28
    versionCode 1
    versionName "0.2.0"
    ndk { abiFilters 'arm64-v8a' }

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  signingConfigs {
    release {
      storeFile file(System.getenv("RELEASE_STORE_FILE") ?: "release.keystore")
      storePassword System.getenv("RELEASE_STORE_PASSWORD")
      keyAlias System.getenv("RELEASE_KEY_ALIAS")
      keyPassword System.getenv("RELEASE_KEY_PASSWORD")
    }
  }
  buildTypes {
    release {
      // R8 would rename Termux's JNI classes and break the PTY code; the APK is mostly binaries anyway.
      minifyEnabled false
      shrinkResources false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.release
    }
    debug {
      applicationIdSuffix ".debug"
    }
  }

  // proot / qemu are executed straight from nativeLibraryDir, so the .so files must be extracted on install.
  packaging {
    jniLibs { useLegacyPackaging = true }
  }

  // targetSdk 28 is intentional (see above)
  lint {
    abortOnError false
    checkReleaseBuilds false
    disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  kotlinOptions {
    jvmTarget = '1.8'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.12.0'
  implementation 'com.github.termux.termux-app:terminal-view:v0.118.0'
  implementation 'com.github.termux.termux-app:terminal-emulator:v0.118.0'
  implementation 'org.apache.commons:commons-compress:1.21'
  implementation 'org.tukaani:xz:1.9'

  testImplementation 'junit:junit:4.13.2'
}
