pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
    // Termux terminal-emulator / terminal-view are only published on JitPack
    maven {
      url 'https://jitpack.io'
      content { includeGroup 'com.github.termux.termux-app' }
    }
  }
}
rootProject.name = "DebianLiveCD4Android"
include ':app'
